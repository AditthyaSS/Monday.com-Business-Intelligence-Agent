[project]
name = "skylark-bi-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "google-genai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "numpy>=1.26,<3",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm install && npm run build"
